{% if breadcrumbs %}
<nav class="mb-6" aria-label="Breadcrumb">
  <ol class="flex flex-wrap items-center gap-1.5 text-sm text-stone-500">
    <li>
      <a href="{{ url_for('admin.dashboard') }}" class="transition hover:text-brand-700">Home</a>
    </li>
    {% for crumb in breadcrumbs %}
      <li class="flex items-center gap-1.5">
        <span class="text-stone-300" aria-hidden="true">/</span>
        {% if crumb.url %}
          <a href="{{ crumb.url }}" class="transition hover:text-brand-700">{{ crumb.label }}</a>
        {% else %}
          <span class="{% if loop.last %}font-medium text-stone-800{% endif %}">{{ crumb.label }}</span>
        {% endif %}
      </li>
    {% endfor %}
  </ol>
</nav>
{% endif %}
