<article class="relative overflow-hidden rounded-2xl border border-stone-200/90 bg-white p-5 shadow-[0_1px_2px_rgba(15,23,42,0.04)]">
  <div class="flex items-start justify-between gap-3">
    <div>
      <p class="text-sm font-medium text-stone-500">{{ label }}</p>
      <p class="mt-2 font-display text-3xl font-semibold tracking-tight text-stone-900">{{ value }}</p>
      {% if hint %}
        <p class="mt-1 text-xs text-stone-500">{{ hint }}</p>
      {% endif %}
    </div>
    <div class="flex h-10 w-10 items-center justify-center rounded-xl {{ accent|default('bg-brand-50 text-brand-700') }}">
      {{ icon_svg|safe }}
    </div>
  </div>
</article>
