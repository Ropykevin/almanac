{% extends "base.html" %}

{% block title %}Too many requests — {{ config.APP_NAME }}{% endblock %}
{% block meta_robots %}noindex{% endblock %}

{% block content %}
<section class="mx-auto max-w-lg px-4 py-24 text-center">
  <p class="text-sm font-semibold uppercase tracking-[0.16em] text-stone-500">429</p>
  <h1 class="mt-3 font-display text-3xl font-semibold text-ink-900">Slow down</h1>
  <p class="mt-3 text-stone-600">
    Too many requests from this address. Wait a moment and try again.
  </p>
  <a href="{{ url_for('main.index') }}" class="mt-8 inline-flex rounded-md bg-brand-800 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-900">
    Back home
  </a>
</section>
{% endblock %}
