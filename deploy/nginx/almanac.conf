# Almanac Africa AI — nginx reverse proxy
# Copy to /etc/nginx/sites-available/almanac
# Replace YOUR_DOMAIN with your real domain (e.g. almanac.africa).
#
# HTTP-only first (for certbot), then enable the SSL server block
# after certificates exist. See DEPLOY.md.

upstream almanac_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Redirect HTTP → HTTPS (enable after certbot has issued certs)
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Certbot paths (created by: certbot --nginx -d YOUR_DOMAIN)
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Match Flask MAX_CONTENT_LENGTH (16 MB uploads)
    client_max_body_size 16m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://almanac_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /health {
        proxy_pass http://almanac_app/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
