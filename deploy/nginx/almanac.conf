# Almanac Africa AI — nginx reverse proxy for almanac.africa
# App: Gunicorn on 127.0.0.1:8002 (see HOST_PORT in .env / docker-compose)
#
# Install after certbot has issued certificates:
#   ./deployment.sh nginx-ssl
# Or: sudo cp deploy/nginx/almanac.conf /etc/nginx/sites-available/almanac

upstream almanac_app {
    server 127.0.0.1:8002;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name almanac.africa www.almanac.africa;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name almanac.africa www.almanac.africa;

    ssl_certificate     /etc/letsencrypt/live/almanac.africa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/almanac.africa/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 16m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://almanac_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # Use the connecting client only — do not trust inbound X-Forwarded-For
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /health {
        proxy_pass http://almanac_app/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
