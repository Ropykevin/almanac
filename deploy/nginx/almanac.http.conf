# Almanac Africa AI — HTTP-only site (first boot / certbot)
# App: Gunicorn on 127.0.0.1:8002
#
#   ./deployment.sh nginx-http
# After certs: ./deployment.sh certbot && ./deployment.sh nginx-ssl

upstream almanac_app {
    server 127.0.0.1:8002;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name almanac.africa www.almanac.africa;

    client_max_body_size 16m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://almanac_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
    }
}
