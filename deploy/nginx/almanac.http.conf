# Temporary HTTP-only site for first boot / certbot
# Copy to /etc/nginx/sites-available/almanac before SSL exists.
# After certbot --nginx succeeds, replace with almanac.conf (full SSL).

upstream almanac_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    client_max_body_size 16m;

    location / {
        proxy_pass http://almanac_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
    }
}
