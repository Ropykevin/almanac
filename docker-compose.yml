services:
  db:
    image: postgres:16-alpine
    container_name: almanac-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-almanac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-almanac_africa_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - almanac
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: almanac-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - almanac
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    build: .
    container_name: almanac-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      FLASK_APP: wsgi.py
      FLASK_CONFIG: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-almanac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-almanac_africa_ai}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_TO_STDOUT: "1"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      GUNICORN_BIND: "0.0.0.0:8002"
      # Shared across Gunicorn workers (required when WEB_CONCURRENCY > 1)
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      PREFERRED_URL_SCHEME: https
      PROXY_FIX: ${PROXY_FIX:-1}
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-1}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    ports:
      - "127.0.0.1:${HOST_PORT:-8002}:8002"
    volumes:
      - media_uploads:/app/app/static/uploads
      - app_logs:/app/logs
    networks:
      - almanac
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  almanac:
    driver: bridge

volumes:
  postgres_data:
  media_uploads:
  app_logs:
  redis_data:
