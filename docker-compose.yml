services:
  db:
    image: postgres:16-alpine
    container_name: almanac-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-almanac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-almanac_africa_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - almanac
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Do not publish 5432 publicly — only the web container needs DB.
    # ports:
    #   - "127.0.0.1:5432:5432"

  web:
    build: .
    container_name: almanac-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_APP: wsgi.py
      FLASK_CONFIG: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      # Discrete DB parts — entrypoint builds DATABASE_URL (URL-encodes password).
      # Do NOT set DATABASE_URL to localhost in .env for Docker; it is ignored here.
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-almanac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-almanac_africa_ai}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_TO_STDOUT: "1"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      GUNICORN_BIND: ${GUNICORN_BIND:-0.0.0.0:8000}
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-memory://}
      PREFERRED_URL_SCHEME: https
      PROXY_FIX: ${PROXY_FIX:-1}
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-1}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-}
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    volumes:
      - media_uploads:/app/app/static/uploads
      - app_logs:/app/logs
    networks:
      - almanac
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  almanac:
    driver: bridge

volumes:
  postgres_data:
  media_uploads:
  app_logs:
